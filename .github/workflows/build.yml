name: Build Android

on:
  workflow_dispatch:
  push:
    branches: [ttr, '3.*']
  pull_request:
    branches: [ttr, '3.*']

permissions:
  contents: write

jobs:
  build:
    if: ${{ github.repository_owner == 'George-Codr' && github.event.repository.name == 'klo' }}
    name: Build Android Python (${{ matrix.version }}) NDK ${{ matrix.ndk_major }}
    runs-on: macos-15
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: 3.13.11
            filename: Python-3.13.11.tgz
            folder: Python-3.13.11
            url_secret: https://www.python.org/ftp/python/3.13.11/Python-3.13.11.tgz
            ndk_version: 27.3.13750724
            ndk_major: 27

    env:
      ARCH: aarch64
      ANDROID_NDK_VERSION: ${{ matrix.ndk_version }}
      ANDROID_SDK_VERSION: 35
      ANDROID_BUILD_TOOLS: 35.0.0
      LLVM_VERSION: 21

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install macOS dependencies for Python build
        run: |
          brew update
          for pkg in gdbm ncurses readline libffi tcl-tk ossp-uuid xz wget dpkg; do
            if ! brew list --formula | grep -q "^${pkg}\$"; then
              echo "Installing $pkg..."
              brew install "$pkg"
            else
              echo "$pkg already installed."
            fi
          done
          brew uninstall gcc || true
          echo "✅ macOS build dependencies installed."
          rsync --version
      - name: Set up Android SDK + NDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          set -euxo pipefail
          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_SDK_VERSION}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}"
          echo "✅ Android NDK ${ANDROID_NDK_VERSION} installed."
          ls -1 $ANDROID_HOME/ndk/

      - name: Set environment to use SDK/NDK Clang
        run: |
          set -euxo pipefail

          export NDK_PATH="$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}"
          if [ -d "$NDK_PATH/toolchains/llvm/prebuilt/darwin-x86_64" ]; then
            export TOOLCHAIN="$NDK_PATH/toolchains/llvm/prebuilt/darwin-x86_64"
          elif [ -d "$NDK_PATH/toolchains/llvm/prebuilt/darwin-arm64" ]; then
            export TOOLCHAIN="$NDK_PATH/toolchains/llvm/prebuilt/darwin-arm64"
          else
            echo "⚠️ NDK toolchain not found; using system clang instead"
            export TOOLCHAIN="/usr/bin"
          fi
          echo "$TOOLCHAIN/bin" >> $GITHUB_PATH
          if [ -x "$TOOLCHAIN/bin/clang" ]; then
            export CC="$TOOLCHAIN/bin/clang"
            export CXX="$TOOLCHAIN/bin/clang++"
          else
            export CC=$(command -v clang)
            export CXX=$(command -v clang++)
          fi
          export AR="$TOOLCHAIN/bin/llvm-ar"
          export LD="$TOOLCHAIN/bin/ld.lld"
          export NM="$TOOLCHAIN/bin/llvm-nm"
          export RANLIB="$TOOLCHAIN/bin/llvm-ranlib"
          echo "✅ Using Clang from SDK/NDK"
          $CC --version
          $AR --version
          export PATH="/usr/local/opt/tcl-tk/bin:$PATH"
          export CPPFLAGS="${CPPFLAGS:-}"
          export LDFLAGS="${LDFLAGS:-}"
          export CPPFLAGS="-I/usr/local/opt/gdbm/include -I/usr/local/opt/ncurses/include -I/usr/local/opt/readline/include -I/usr/local/opt/libffi/include -I/usr/local/opt/tcl-tk/include $CPPFLAGS"
          export LDFLAGS="-L/usr/local/opt/gdbm/lib -L/usr/local/opt/ncurses/lib -L/usr/local/opt/readline/lib -L/usr/local/opt/libffi/lib -L/usr/local/opt/tcl-tk/lib $LDFLAGS"
          export PKG_CONFIG_PATH="/usr/local/opt/libffi/lib/pkgconfig"
          if [ "$(uname)" = "Darwin" ]; then
            export CPU_COUNT="$(sysctl -n hw.ncpu)"
          else
            export CPU_COUNT="$(nproc)"
          fi
          echo "✅ Host environment configured."
      - name: Download and extract Termux dependencies
        run: |
          set -euxo pipefail
          mkdir -p $GITHUB_WORKSPACE/termux-deps/extracted/usr
          mkdir -p $GITHUB_WORKSPACE/termux-deps/extracted/usr/lib
          mkdir -p $GITHUB_WORKSPACE/termux-deps/extracted/usr/include
          mkdir -p $GITHUB_WORKSPACE/termux-deps/extracted/usr/lib/pkgconfig
          mkdir -p $GITHUB_WORKSPACE/termux-deps
          cd $GITHUB_WORKSPACE/termux-deps
          curl -L -o libuuid.deb https://packages.termux.dev/apt/termux-main/pool/main/libu/libuuid/libuuid_2.41.2_aarch64.deb
          curl -L -o ncurses.deb https://packages.termux.dev/apt/termux-main/pool/main/n/ncurses/ncurses_6.5.20240831-3_aarch64.deb
          curl -L -o gdbm.deb https://packages.termux.dev/apt/termux-main/pool/main/g/gdbm/gdbm_1.26-1_aarch64.deb
          curl -L -o readline.deb https://packages.termux.dev/apt/termux-main/pool/main/r/readline/readline_8.3.1-2_aarch64.deb
          for f in *.deb; do
            dpkg-deb -x "$f" extracted
          done
          ls */*
          echo "✅ Termux deps extracted to: $GITHUB_WORKSPACE/termux-deps/extracted"
          ls -R extracted/usr | head -n 50
      - name: Configure Termux dependency paths
        run: |
          set -euxo pipefail
          TERMUX_DEPS="$GITHUB_WORKSPACE/termux-deps/extracted/usr"
          mkdir -p $GITHUB_WORKSPACE/termux-deps/extracted/usr
          mkdir -p $GITHUB_WORKSPACE/termux-deps/extracted/usr/lib
          mkdir -p $GITHUB_WORKSPACE/termux-deps/extracted/usr/include
          mkdir -p $GITHUB_WORKSPACE/termux-deps/extracted/usr/lib/pkgconfig
          echo "Using Termux deps at: $TERMUX_DEPS"
          echo "CPPFLAGS=-I$TERMUX_DEPS/include " >> $GITHUB_ENV
          echo "LDFLAGS=-L$TERMUX_DEPS/lib " >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=$TERMUX_DEPS/lib/pkgconfig " >> $GITHUB_ENV

      - name: Download official Python source tarball (from Secret)
        run: |
          set -euxo pipefail
          FILE="${{ matrix.filename }}"
          FOLDER="${{ matrix.folder }}"
          VERSION="${{ matrix.version }}"
          URL="https://www.python.org/ftp/python/3.13.11/Python-3.13.11.tgz"
          if [ -z "$URL" ]; then
            echo "❌ Secret for version $VERSION not set."
            exit 1
          fi

          echo "Downloading Python from $URL"
          curl -L "$URL" -o "$FILE"
          tar -xzf "$FILE"
          mv "$FOLDER" "cpython-${VERSION}"
          export PREFIX="/Users/runner/work/klo/klo/cpython-3.13.11/cross-build/aarch64-linux-android/prefix"
          export TERMUX="/Users/runner/work/klo/klo/termux-deps/extracted/usr"
          mkdir -p "$PREFIX/include"
          mkdir -p "$PREFIX/lib"
          mkdir -p "$PREFIX/lib/pkgconfig"
          rsync -a "$TERMUX/include/" "$PREFIX/include/"
          rsync -a "$TERMUX/lib/" "$PREFIX/lib/" \
            --exclude="libpython*" \
            --exclude="libmimalloc*"
          rsync -a "$TERMUX/lib/pkgconfig/" "$PREFIX/lib/pkgconfig/"
          

      - name: Build CPython for Android
        working-directory: ./cpython-${{ matrix.version }}
        env:
          CC: ${{ env.CC }}
          CXX: ${{ env.CXX }}
          AR: ${{ env.AR }}
          LD: ${{ env.LD }}
          NM: ${{ env.NM }}
          RANLIB: ${{ env.RANLIB }}
        run: |
          set -euxo pipefail
          VERSION="${{ matrix.version }}"
          case "$VERSION" in
            3.13.11) wget https://raw.githubusercontent.com/yubrajbhoi/termux-python/fb5bad6582a83fe6db36840f47e29521083160a1/termux.patch && git apply termux.patch ;;
            3.14.2) wget https://raw.githubusercontent.com/yubrajbhoi/termux-python/refs/heads/main/termux.patch && git apply termux.patch ;;
            *) echo "Skip" ;;
          esac
          cd Android
          #rm -rf android-env.sh
          #wget https://raw.githubusercontent.com/aikwp/Ads/refs/heads/ttr/android-env.sh
          ./android.py ci --fast-ci aarch64-linux-android
          echo "✅ Build finished for version ${{ matrix.version }}"
          ls -lh ../cross-build/aarch64-linux-android || echo "⚠️ Build output not found"
#          ../cross-build/aarch64-linux-android/prefix/bin/python3 -c "print(__import__('sys').version)"

      - name: Package as .deb
        run: |
          set -euxo pipefail
          VERSION="${{ matrix.version }}"
          NDK_MAJOR="${{ matrix.ndk_major }}"
          PKG_NAME="pyv${VERSION//./}-ndk${NDK_MAJOR}"
          PKG_VERSION="$VERSION"
          ARCH="aarch64"
          BUILD_DIR="./cpython-${VERSION}/cross-build/${ARCH}-linux-android"
          OUT_DIR=$( [ -d "$BUILD_DIR/prefix" ] && echo "$BUILD_DIR/prefix" || echo "$BUILD_DIR/install" )
          DEB_DIR="$PKG_NAME"

          mkdir -p "$DEB_DIR/DEBIAN"
          mkdir -p "$DEB_DIR/usr"
          cp -r "$OUT_DIR"/* "$DEB_DIR/usr/"

          cat > "$DEB_DIR/DEBIAN/control" <<EOF
          Package: $PKG_NAME
          Version: $PKG_VERSION
          Architecture: $ARCH
          Maintainer: Cross-compiled by NotFound
          Description: Python $PKG_VERSION cross-compiled for Termux aarch64 using SDK Clang + LLVM ${LLVM_VERSION} with NDK r${NDK_MAJOR}
          EOF

          cat > "$DEB_DIR/DEBIAN/postinst" <<EOF
          #!/bin/sh
          set -e
          echo "$PKG_NAME installed successfully!"
          exit 0
          EOF
          chmod 755 "$DEB_DIR/DEBIAN/postinst"

          dpkg-deb --build "$DEB_DIR" pyv_${{ matrix.version }}_aarch64.deb

      - name: Upload .deb as Artifact
        uses: actions/upload-artifact@v6
        with:
          name: deb-pyv${{ matrix.version }}
          path: pyv_${{ matrix.version }}_aarch64.deb
      - name: Create / Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pyv__a
          name: pyv
          body: |
            **Python:** 3.13
            **Arch:** aarch64
            **NDK:** r27
            **Commit:** ${{ github.sha }}
            **Run:** ${{ github.run_id }}

            Built automatically by GitHub Actions.
          files: |
            pyv*_${{ matrix.version }}_aarch64.deb
          fail_on_unmatched_files: true
          overwrite_files: true
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
